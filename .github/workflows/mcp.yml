name: sxt-mcp

on:
  push:
    branches: [main]
    paths: ["packages/mcp/sxt-mcp/**", ".github/workflows/mcp.yml"]
  pull_request:
    paths: ["packages/mcp/sxt-mcp/**", ".github/workflows/mcp.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: packages/mcp/sxt-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/mcp/sxt-mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Smokes make no SXT calls and spend nothing.
      - run: npm run smoke
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build hosted image
        run: docker build -t sxt-mcp:ci packages/mcp/sxt-mcp
      - name: Boot in public mode and probe health
        run: |
          docker run -d --name mcp -p 8080:8080 \
            -e SXT_MCP_PUBLIC_URL=http://localhost:8080 \
            -e SXT_MCP_TOKEN_SECRET="$(openssl rand -base64 36)" \
            sxt-mcp:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && exit 0; sleep 1; done
          docker logs mcp; exit 1

  worker:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: packages/mcp/sxt-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/mcp/sxt-mcp/package-lock.json
      - run: npm ci
      # Fails if the pinned SDK's version or sha256 changed (see build-worker-verifier.mjs).
      - run: npm run check:worker
      - name: Boot under workerd and probe
        run: |
          printf 'SXT_MCP_PUBLIC_URL=http://localhost:8787\nSXT_MCP_TOKEN_SECRET=%s\n' "$(openssl rand -base64 36)" > .dev.vars
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8787/healthz && break; sleep 1; done
          curl -fsS http://localhost:8787/.well-known/oauth-protected-resource/mcp
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/mcp -H 'content-type: application/json' -d '{}')" = 401 || { cat wrangler.log; exit 1; }
